<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>图文同步助手</title><link rel="stylesheet" href="style.css"></head><body><main><h1>图文同步助手</h1><p>使用当前浏览器中已登录的账号。发布结果不明时请先核查，不要重复提交。</p><label>标题<input id="title" maxlength="100"></label><label>正文<textarea id="content" rows="13"></textarea></label><label>话题（用逗号分隔）<input id="tags" placeholder="AI工具,人工智能"></label><fieldset><legend>内容声明（按本次内容选择）</legend><label><input type="checkbox" id="xhsOriginal"> 小红书原创声明</label><label><input type="checkbox" id="douyinAi"> 抖音内容由 AI 生成</label></fieldset><label>图片<input id="images" type="file" accept="image/*" multiple></label><fieldset><legend>目标平台</legend><label><input type="checkbox" value="xiaohongshu" checked> 小红书</label><label><input type="checkbox" value="douyin" checked> 抖音</label></fieldset><label><input id="dryRun" type="checkbox" checked> 测试模式：只填入，不发布</label><button id="start">开始发布</button><div id="status" role="status" aria-live="polite"></div></main><script src="index.js"></script></body></html>
